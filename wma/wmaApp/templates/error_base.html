<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Something went wrong{% endblock %} | WMA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18343d; background: #f0f7f8; }
    main { width: min(100%, 520px); padding: clamp(28px, 6vw, 52px); background: #fff; border: 1px solid #dbe9ea; border-radius: 20px; box-shadow: 0 16px 48px rgba(30, 53, 62, .09); }
    .brand { color: #287985; font-size: .8rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .code { margin: 36px 0 10px; color: #318c98; font-size: 1rem; font-weight: 700; }
    h1 { margin: 0 0 14px; font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.15; }
    p { margin: 0; color: #526a70; line-height: 1.65; }
    a { display: inline-block; margin-top: 30px; padding: 12px 20px; border-radius: 8px; background: #1e5963; color: #fff; text-decoration: none; font-weight: 650; }
    a:hover { background: #164750; }
    a:focus-visible { outline: 3px solid #80cbd3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Water Management</div>
    <div class="code">Error {% block code %}{% endblock %}</div>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <a href="/">Go to home</a>
  </main>
</body>
</html>
